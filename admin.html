<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Jelajah Indonesia</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#16a34a" />

  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Quill.js CSS -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['Poppins', 'system-ui', 'sans-serif'],
          },
          colors: {
            green: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
            red: { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d' },
            gold: { 400:'#fbbf24',500:'#f59e0b',600:'#d97706' },
            warm: { 50:'#fefdfb',100:'#f7f5f2',200:'#ebe7e1',300:'#d6d0c7',400:'#a8a29e',500:'#78716c',600:'#57534e',700:'#44403c',800:'#292524',900:'#1c1917' }
          },
          boxShadow: {
            'glow-green': '0 10px 30px rgba(22, 163, 74, 0.35)',
            'glow-red': '0 10px 30px rgba(220, 38, 38, 0.35)',
          },
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Poppins', system-ui, sans-serif; }
    h1, h2, h3, h4 { font-family: 'Playfair Display', Georgia, serif; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #f7f5f2; }
    ::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 5px; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #22c55e; outline-offset: 3px; border-radius: 4px;
    }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* QUILL CUSTOM STYLING */
    .ql-toolbar.ql-snow {
      border: 1px solid #ebe7e1; border-top-left-radius: 12px; border-top-right-radius: 12px;
      background: #fefdfb; padding: 10px 12px; font-family: 'Poppins', sans-serif;
      position: sticky; top: 0; z-index: 5;
    }
    .ql-container.ql-snow {
      border: 1px solid #ebe7e1; border-top: none;
      border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
      background: #ffffff; font-family: 'Poppins', sans-serif; font-size: 1rem;
    }
    .ql-editor { min-height: 300px; padding: 20px; line-height: 1.7; color: #44403c; }
    .ql-editor.ql-blank::before { color: #a8a29e; font-style: normal; left: 20px; right: 20px; }
    .ql-editor h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 800; margin: 1rem 0 .5rem; }
    .ql-editor h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; margin: 1rem 0 .5rem; }
    .ql-editor blockquote { border-left: 4px solid #dc2626; padding-left: 1rem; font-style: italic; color: #57534e; background: #fef2f2; border-radius: 0 8px 8px 0; padding: 1rem 1rem 1rem 1.25rem; margin: 1rem 0; }
    .ql-snow .ql-toolbar button:hover .ql-stroke, .ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: #16a34a !important; }
    .ql-snow .ql-toolbar button:hover .ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-fill { fill: #16a34a !important; }
  </style>
</head>

<body class="bg-warm-50 text-warm-700 min-h-screen flex flex-col">

  <!-- Navbar Minimalis -->
  <nav class="sticky top-0 z-50 py-3 bg-white/95 backdrop-blur-xl border-b border-warm-200/60">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between gap-4">
      <a href="admin.html" class="flex items-center gap-2.5 whitespace-nowrap">
        <img src="/assets/logo-navbar.png" alt="Jelajah Indonesia" class="h-10 w-auto" />
        <span class="hidden sm:inline-block ml-1 px-2 py-0.5 bg-green-100 text-green-700 text-[10px] uppercase tracking-widest font-bold rounded">Admin</span>
      </a>

      <div class="flex items-center gap-2 md:gap-3">
        <a href="/" target="_blank" rel="noopener" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 bg-warm-100 hover:bg-green-100 text-warm-700 hover:text-green-700 text-xs md:text-sm font-semibold rounded-full transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span class="hidden md:inline">Kunjungi Website</span>
        </a>

        <div id="userSection" class="hidden items-center gap-2">
          <div class="hidden md:flex flex-col items-end leading-tight mr-1">
            <span id="userName" class="text-xs font-semibold text-warm-700">-</span>
            <span id="userRole" class="text-[10px] uppercase tracking-wider text-warm-400 font-medium">-</span>
          </div>
          <button id="logoutBtn" class="inline-flex items-center gap-1.5 px-3 py-2 bg-warm-100 hover:bg-red-500 hover:text-white text-warm-700 text-xs font-semibold rounded-full transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="hidden sm:inline">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main id="app" class="flex-1"></main>

  <!-- ================== MODAL ARTIKEL ================== -->
  <div id="postModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full my-8 border border-warm-200">
      <div class="flex items-center justify-between p-6 border-b border-warm-200">
        <h2 id="modalTitle" class="font-heading text-2xl font-bold">Tambah Artikel</h2>
        <button id="modalClose" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-warm-100 transition-colors text-xl">×</button>
      </div>
      <form id="postForm" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
        <input type="hidden" id="postId" />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium mb-2">Judul *</label><input type="text" id="postJudul" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
          <div><label class="block text-sm font-medium mb-2">Penulis *</label><input type="text" id="postPenulis" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
          <div><label class="block text-sm font-medium mb-2">Tipe *</label>
            <select id="postTipe" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500">
              <option value="cerita">Cerita Perjalanan</option><option value="gaya-hidup">Gaya Hidup</option><option value="akomodasi">Akomodasi</option><option value="newsedu">Newsedu</option><option value="event">Event</option>
            </select>
          </div>
          <div><label class="block text-sm font-medium mb-2">Kategori *</label><input type="text" id="postKategori" required placeholder="cth: Gunung, Kuliner" class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
          <div><label class="block text-sm font-medium mb-2">Tanggal *</label><input type="date" id="postTanggal" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
          <div><label class="block text-sm font-medium mb-2">Status *</label>
            <select id="postStatus" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500">
              <option value="draft">Draft</option><option value="published">Published</option>
            </select>
          </div>
        </div>
        <div><label class="block text-sm font-medium mb-2">URL Gambar Utama *</label><input type="url" id="postGambar" required placeholder="https://..." class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
        <div><label class="block text-sm font-medium mb-2">Ringkasan *</label><textarea id="postRingkasan" required rows="2" class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500 resize-none"></textarea></div>
        <div><label class="block text-sm font-medium mb-2">Isi Artikel *</label><div id="editorContainer" class="bg-white rounded-xl"><div id="editor"></div></div></div>
        <div id="formError" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>
        <div class="flex gap-3 justify-end pt-4 border-t border-warm-200">
          <button type="button" id="previewBtn" class="px-5 py-2.5 bg-warm-100 text-warm-700 text-sm font-semibold rounded-xl hover:bg-warm-200 transition-all">👁 Preview</button>
          <button type="submit" id="saveBtn" class="px-6 py-2.5 bg-gradient-to-br from-green-600 to-green-700 text-white text-sm font-semibold rounded-xl shadow-glow-green hover:-translate-y-0.5 transition-all disabled:opacity-50">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================== MODAL IKLAN ================== -->
  <div id="adModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full my-8 border border-warm-200">
      <div class="flex items-center justify-between p-6 border-b border-warm-200">
        <h2 id="adModalTitle" class="font-heading text-2xl font-bold">Tambah Iklan</h2>
        <button id="adModalClose" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-warm-100 transition-colors text-xl">×</button>
      </div>
      <form id="adForm" class="p-6 space-y-4">
        <input type="hidden" id="adId" />
        <div>
          <label class="block text-sm font-medium mb-2">Judul Iklan (Internal) *</label>
          <input type="text" id="adJudul" required placeholder="cth: Promo Bali" class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">URL Gambar Banner *</label>
          <input type="url" id="adGambar" required placeholder="https://..." class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" />
          <p class="text-xs text-warm-400 mt-1">Gunakan ukuran horizontal untuk hero/feed, portrait untuk sidebar.</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">URL Tujuan (Link) *</label>
          <input type="url" id="adLink" required placeholder="https://..." class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Posisi Iklan *</label>
          <select id="adPosisi" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500">
            <option value="hero">Hero (Bawah Banner Utama)</option>
            <option value="feed-1">Feed 1 (Setelah 3 Artikel)</option>
            <option value="feed-2">Feed 2 (Setelah 6 Artikel)</option>
            <option value="sidebar">Sidebar Artikel (Kanan)</option>
            <option value="in-article">In-Article (Tengah Artikel)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Status *</label>
          <select id="adStatus" required class="w-full px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500">
            <option value="aktif">Aktif</option>
            <option value="nonaktif">Nonaktif</option>
          </select>
        </div>
        <div id="adFormError" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>
        <div class="flex gap-3 justify-end pt-4 border-t border-warm-200">
          <button type="submit" id="adSaveBtn" class="px-6 py-2.5 bg-gradient-to-br from-green-600 to-green-700 text-white text-sm font-semibold rounded-xl shadow-glow-green hover:-translate-y-0.5 transition-all disabled:opacity-50">Simpan Iklan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Preview -->
  <div id="previewModal" class="hidden fixed inset-0 z-[60] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full my-8 border border-warm-200 max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 flex items-center justify-between p-4 border-b border-warm-200 bg-white z-10">
        <h2 class="font-heading text-xl font-bold">👁 Preview Artikel</h2>
        <button id="previewClose" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-warm-100 transition-colors text-xl">×</button>
      </div>
      <div id="previewContent" class="p-6"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-6 py-3 rounded-full text-white font-medium shadow-lg"></div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script>
    const API_URL = 'https://jelajah-api.akabonanza-official.workers.dev';

    const api = {
      getToken() { return localStorage.getItem('admin_token'); },
      setToken(t) { localStorage.setItem('admin_token', t); },
      clearToken() { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_user'); },
      getUser() { try { return JSON.parse(localStorage.getItem('admin_user') || 'null'); } catch { return null; } },
      setUser(u) { localStorage.setItem('admin_user', JSON.stringify(u)); },
      async request(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        const token = this.getToken();
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`${API_URL}${path}`, { ...options, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      },
      async login(u, p) {
        const res = await fetch(`${API_URL}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        return data;
      },
      getPosts() { return this.request('/posts'); },
      createPost(p) { return this.request('/posts', { method: 'POST', body: JSON.stringify({ post: p }) }); },
      updatePost(id, p) { return this.request(`/posts/${id}`, { method: 'PUT', body: JSON.stringify({ post: p }) }); },
      deletePost(id) { return this.request(`/posts/${id}`, { method: 'DELETE' }); },
      getAds() { return this.request('/ads'); },
      createAd(a) { return this.request('/ads', { method: 'POST', body: JSON.stringify({ ad: a }) }); },
      updateAd(id, a) { return this.request(`/ads/${id}`, { method: 'PUT', body: JSON.stringify({ ad: a }) }); },
      deleteAd(id) { return this.request(`/ads/${id}`, { method: 'DELETE' }); },
    };

    const formatDate = (iso) => {
      if (!iso) return '-';
      const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      const d = new Date(iso);
      return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
    };
    const escapeHtml = (str = '') => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    let quill = null;
    function initQuill() {
      if (quill) return quill;
      quill = new Quill('#editor', {
        theme: 'snow', placeholder: 'Mulai tulis artikel di sini...',
        modules: { toolbar: [[{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline', 'strike'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['blockquote', 'link', 'image'], [{ 'align': [] }], ['clean']] }
      });
      const toolbar = quill.getModule('toolbar');
      toolbar.addHandler('image', () => { const url = prompt('Masukkan URL gambar:'); if (url) { const range = quill.getSelection(true); quill.insertEmbed(range.index, 'image', url); quill.setSelection(range.index + 1); } });
      toolbar.addHandler('link', () => { const url = prompt('Masukkan URL link:'); if (url) { const range = quill.getSelection(true); if (range.length > 0) quill.formatText(range.index, range.length, 'link', url, 'user'); else quill.insertText(range.index, url, 'link', url); } });
      return quill;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-6 py-3 rounded-full text-white font-medium shadow-lg ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    const app = document.getElementById('app');
    const userSection = document.getElementById('userSection');
    
    let allPosts = [], filteredPosts = [];
    let allAds = [], filteredAds = [];
    let currentTab = 'posts';

    // ============ LOGIN VIEW ============
    function renderLogin() {
      userSection.classList.add('hidden'); userSection.classList.remove('flex');
      document.title = 'Login — Admin Jelajah Indonesia';
      app.innerHTML = `
        <section class="min-h-[80vh] flex items-center justify-center px-6 py-20 bg-warm-50">
          <div class="w-full max-w-md">
            <div class="text-center mb-8">
              <div class="w-16 h-16 mx-auto flex items-center justify-center bg-gradient-to-br from-green-500 to-green-700 rounded-2xl text-white text-3xl shadow-glow-green mb-4">🔐</div>
              <h1 class="font-heading text-3xl font-extrabold mb-2">Admin Panel</h1>
              <p class="text-warm-500 text-sm">Masuk untuk mengelola konten</p>
            </div>
            <form id="loginForm" class="bg-white rounded-2xl shadow-lg p-8 border border-warm-200">
              <div class="mb-5"><label class="block text-sm font-medium mb-2">Username</label><input type="text" id="loginUsername" required class="w-full px-4 py-3 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
              <div class="mb-6"><label class="block text-sm font-medium mb-2">Password</label><input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-warm-50 border border-warm-200 rounded-xl outline-none focus:border-green-500" /></div>
              <div id="loginError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>
              <button type="submit" id="loginBtn" class="w-full py-3.5 bg-gradient-to-br from-green-600 to-green-700 text-white font-semibold rounded-xl shadow-glow-green hover:-translate-y-0.5 transition-all disabled:opacity-50">Masuk</button>
            </form>
          </div>
        </section>
      `;
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn'), err = document.getElementById('loginError');
        btn.disabled = true; btn.textContent = 'Memproses...'; err.classList.add('hidden');
        try {
          const res = await api.login(document.getElementById('loginUsername').value.trim(), document.getElementById('loginPassword').value);
          api.setToken(res.token); api.setUser(res.user); renderDashboard();
        } catch (e) {
          err.textContent = e.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Masuk';
        }
      });
    }

    // ============ DASHBOARD VIEW ============
    function renderDashboard() {
      const user = api.getUser();
      if (!user) return renderLogin();
      userSection.classList.remove('hidden'); userSection.classList.add('flex');
      document.getElementById('userName').textContent = user.name || user.username;
      document.getElementById('userRole').textContent = user.role || 'admin';

      app.innerHTML = `
        <section class="py-8 px-6">
          <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
              <div>
                <h1 class="font-heading text-3xl font-extrabold mb-1">Dashboard</h1>
                <p class="text-sm text-warm-500">Kelola konten dan iklan website</p>
              </div>
              <button id="addBtn" class="px-5 py-2.5 bg-gradient-to-br from-green-600 to-green-700 text-white text-sm font-semibold rounded-full shadow-glow-green hover:-translate-y-0.5 transition-all">
                + Tambah <span id="addBtnText">Artikel</span>
              </button>
            </div>

            <!-- TABS -->
            <div class="flex border-b border-warm-200 mb-6">
              <button data-tab="posts" class="tab-btn px-6 py-3 font-semibold text-green-700 border-b-2 border-green-600 transition-all">📝 Artikel</button>
              <button data-tab="ads" class="tab-btn px-6 py-3 font-semibold text-warm-500 border-b-2 border-transparent hover:text-green-600 transition-all">📢 Iklan</button>
            </div>

            <!-- STATS -->
            <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

            <!-- FILTERS -->
            <div class="bg-white rounded-2xl p-4 mb-6 border border-warm-200 flex flex-wrap gap-3 items-center">
              <input type="text" id="searchInput" placeholder="Cari..." class="flex-1 min-w-[200px] px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl text-sm outline-none focus:border-green-500" />
              <select id="filterStatus" class="px-4 py-2.5 bg-warm-50 border border-warm-200 rounded-xl text-sm outline-none focus:border-green-500">
                <option value="all">Semua Status</option>
                <option value="published">Published / Aktif</option>
                <option value="draft">Draft / Nonaktif</option>
              </select>
              <button id="refreshBtn" class="px-4 py-2.5 bg-warm-100 hover:bg-green-100 text-warm-700 hover:text-green-700 text-sm font-semibold rounded-xl transition-all">🔄</button>
            </div>

            <!-- TABLE -->
            <div id="dataTable" class="bg-white rounded-2xl border border-warm-200 overflow-hidden">
              <div class="p-8 text-center text-warm-400"><div class="w-12 h-12 mx-auto border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div><p class="mt-3 text-sm">Memuat data...</p></div>
            </div>
          </div>
        </section>
      `;

      // Event Listeners Dashboard
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab;
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('text-green-700', b.dataset.tab === currentTab);
            b.classList.toggle('border-green-600', b.dataset.tab === currentTab);
            b.classList.toggle('text-warm-500', b.dataset.tab !== currentTab);
            b.classList.toggle('border-transparent', b.dataset.tab !== currentTab);
          });
          document.getElementById('addBtnText').textContent = currentTab === 'posts' ? 'Artikel' : 'Iklan';
          document.getElementById('searchInput').value = '';
          loadData();
        });
      });

      document.getElementById('addBtn').addEventListener('click', () => {
        if (currentTab === 'posts') openAddPostModal();
        else openAddAdModal();
      });
      document.getElementById('refreshBtn').addEventListener('click', () => { loadData(); showToast('Data di-refresh'); });
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('filterStatus').addEventListener('change', applyFilters);

      // Modal Close & Forms
      document.getElementById('modalClose').addEventListener('click', () => document.getElementById('postModal').classList.add('hidden'));
      document.getElementById('adModalClose').addEventListener('click', () => document.getElementById('adModal').classList.add('hidden'));
      document.getElementById('previewClose').addEventListener('click', () => document.getElementById('previewModal').classList.add('hidden'));
      
      document.getElementById('postForm').addEventListener('submit', handlePostSubmit);
      document.getElementById('previewBtn').addEventListener('click', handlePreview);
      document.getElementById('adForm').addEventListener('submit', handleAdSubmit);

      // Init
      document.getElementById('statsGrid').innerHTML = '';
      loadData();
    }

    async function loadData() {
      const table = document.getElementById('dataTable');
      table.innerHTML = `<div class="p-8 text-center text-warm-400"><div class="w-12 h-12 mx-auto border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div></div>`;
      try {
        if (currentTab === 'posts') {
          const res = await api.getPosts();
          allPosts = res.posts || [];
          renderStats();
          applyFilters();
        } else {
          const res = await api.getAds();
          allAds = res.ads || [];
          renderStats();
          applyFilters();
        }
      } catch (e) {
        table.innerHTML = `<div class="p-8 text-center text-red-500">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderStats() {
      const statsEl = document.getElementById('statsGrid');
      if (currentTab === 'posts') {
        statsEl.innerHTML = `
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Total Artikel</div><div class="font-heading text-2xl font-extrabold text-green-700">${allPosts.length}</div></div>
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Published</div><div class="font-heading text-2xl font-extrabold text-green-600">${allPosts.filter(p=>p.status==='published').length}</div></div>
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Draft</div><div class="font-heading text-2xl font-extrabold text-gold-500">${allPosts.filter(p=>p.status==='draft').length}</div></div>
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Kategori</div><div class="font-heading text-2xl font-extrabold text-red-600">${new Set(allPosts.map(p => p.kategori)).size}</div></div>
        `;
      } else {
        statsEl.innerHTML = `
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Total Iklan</div><div class="font-heading text-2xl font-extrabold text-green-700">${allAds.length}</div></div>
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Aktif</div><div class="font-heading text-2xl font-extrabold text-green-600">${allAds.filter(a=>a.status==='aktif').length}</div></div>
          <div class="bg-white rounded-xl p-4 border border-warm-200"><div class="text-xs text-warm-500 uppercase mb-1">Nonaktif</div><div class="font-heading text-2xl font-extrabold text-gold-500">${allAds.filter(a=>a.status==='nonaktif').length}</div></div>
        `;
      }
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const status = document.getElementById('filterStatus').value;
      if (currentTab === 'posts') {
        filteredPosts = allPosts.filter(p => {
          if (status === 'published' && p.status !== 'published') return false;
          if (status === 'draft' && p.status !== 'draft') return false;
          return !q || p.judul.toLowerCase().includes(q) || p.penulis.toLowerCase().includes(q);
        });
        renderPostTable();
      } else {
        filteredAds = allAds.filter(a => {
          if (status === 'published' && a.status !== 'aktif') return false;
          if (status === 'draft' && a.status !== 'nonaktif') return false;
          return !q || a.judul.toLowerCase().includes(q);
        });
        renderAdTable();
      }
    }

    // ============ RENDER TABEL ARTIKEL ============
    function renderPostTable() {
      const table = document.getElementById('dataTable');
      if (filteredPosts.length === 0) { table.innerHTML = `<div class="p-12 text-center text-warm-400"><div class="text-5xl mb-3">📭</div><p>Tidak ada artikel.</p></div>`; return; }
      table.innerHTML = `
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="bg-warm-100 text-warm-600"><tr><th class="text-left p-4">Judul</th><th class="text-left p-4 hidden md:table-cell">Tipe</th><th class="text-left p-4">Status</th><th class="text-right p-4">Aksi</th></tr></thead>
          <tbody>
            ${filteredPosts.map(p => `
              <tr class="border-t border-warm-200 hover:bg-warm-50">
                <td class="p-4"><div class="font-medium line-clamp-2 max-w-md">${escapeHtml(p.judul)}</div><div class="text-xs text-warm-400 mt-1">${formatDate(p.tanggal)}</div></td>
                <td class="p-4 hidden md:table-cell"><span class="px-2 py-1 bg-green-50 text-green-700 text-xs rounded-full">${p.tipe}</span></td>
                <td class="p-4">${p.status === 'published' ? '<span class="text-green-600 text-xs font-semibold">✓ Published</span>' : '<span class="text-gold-500 text-xs font-semibold">◐ Draft</span>'}</td>
                <td class="p-4 text-right">
                  <div class="flex gap-1 justify-end">
                    <button onclick="window.open('/artikel/${p.id}', '_blank')" class="w-8 h-8 rounded-full hover:bg-warm-200" title="Lihat">🔗</button>
                    <button data-edit-post="${p.id}" class="w-8 h-8 rounded-full hover:bg-green-100 text-green-700" title="Edit">✏️</button>
                    <button data-del-post="${p.id}" class="w-8 h-8 rounded-full hover:bg-red-100 text-red-600" title="Hapus">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>
      `;
      table.querySelectorAll('[data-edit-post]').forEach(b => b.addEventListener('click', () => openEditPostModal(b.dataset.editPost)));
      table.querySelectorAll('[data-del-post]').forEach(b => b.addEventListener('click', () => confirmDelete('post', b.dataset.delPost)));
    }

    // ============ RENDER TABEL IKLAN ============
    function renderAdTable() {
      const table = document.getElementById('dataTable');
      if (filteredAds.length === 0) { table.innerHTML = `<div class="p-12 text-center text-warm-400"><div class="text-5xl mb-3">📭</div><p>Tidak ada iklan.</p></div>`; return; }
      table.innerHTML = `
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="bg-warm-100 text-warm-600"><tr><th class="text-left p-4">Judul</th><th class="text-left p-4 hidden md:table-cell">Posisi</th><th class="text-left p-4">Status</th><th class="text-right p-4">Aksi</th></tr></thead>
          <tbody>
            ${filteredAds.map(a => `
              <tr class="border-t border-warm-200 hover:bg-warm-50">
                <td class="p-4"><div class="font-medium line-clamp-2 max-w-md">${escapeHtml(a.judul)}</div></td>
                <td class="p-4 hidden md:table-cell"><span class="px-2 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full uppercase">${a.posisi}</span></td>
                <td class="p-4">${a.status === 'aktif' ? '<span class="text-green-600 text-xs font-semibold">✓ Aktif</span>' : '<span class="text-warm-400 text-xs font-semibold">◐ Nonaktif</span>'}</td>
                <td class="p-4 text-right">
                  <div class="flex gap-1 justify-end">
                    <button data-edit-ad="${a.id}" class="w-8 h-8 rounded-full hover:bg-green-100 text-green-700" title="Edit">✏️</button>
                    <button data-del-ad="${a.id}" class="w-8 h-8 rounded-full hover:bg-red-100 text-red-600" title="Hapus">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>
      `;
      table.querySelectorAll('[data-edit-ad]').forEach(b => b.addEventListener('click', () => openEditAdModal(b.dataset.editAd)));
      table.querySelectorAll('[data-del-ad]').forEach(b => b.addEventListener('click', () => confirmDelete('ad', b.dataset.delAd)));
    }

    // ============ FORM ARTIKEL ============
    function openAddPostModal() {
      document.getElementById('postForm').reset(); document.getElementById('postId').value = '';
      document.getElementById('postTanggal').value = new Date().toISOString().split('T')[0];
      document.getElementById('modalTitle').textContent = 'Tambah Artikel';
      document.getElementById('formError').classList.add('hidden');
      initQuill(); quill.root.innerHTML = ''; quill.history.clear();
      document.getElementById('postModal').classList.remove('hidden');
      setTimeout(() => quill.focus(), 200);
    }

    function openEditPostModal(id) {
      const p = allPosts.find(x => x.id === id); if (!p) return;
      document.getElementById('postForm').reset();
      document.getElementById('postId').value = p.id;
      document.getElementById('postJudul').value = p.judul;
      document.getElementById('postPenulis').value = p.penulis;
      document.getElementById('postTipe').value = p.tipe;
      document.getElementById('postKategori').value = p.kategori;
      document.getElementById('postTanggal').value = p.tanggal;
      document.getElementById('postStatus').value = p.status || 'draft';
      document.getElementById('postGambar').value = p.gambar;
      document.getElementById('postRingkasan').value = p.ringkasan;
      document.getElementById('modalTitle').textContent = 'Edit Artikel';
      document.getElementById('formError').classList.add('hidden');
      initQuill(); quill.root.innerHTML = p.isi || ''; quill.history.clear();
      document.getElementById('postModal').classList.remove('hidden');
    }

    async function handlePostSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('postId').value;
      const data = {
        judul: document.getElementById('postJudul').value.trim(), penulis: document.getElementById('postPenulis').value.trim(),
        tipe: document.getElementById('postTipe').value, kategori: document.getElementById('postKategori').value.trim(),
        tanggal: document.getElementById('postTanggal').value, status: document.getElementById('postStatus').value,
        gambar: document.getElementById('postGambar').value.trim(), ringkasan: document.getElementById('postRingkasan').value.trim(),
        isi: quill.root.innerHTML,
      };
      const btn = document.getElementById('saveBtn'), err = document.getElementById('formError');
      btn.disabled = true; btn.textContent = 'Menyimpan...'; err.classList.add('hidden');
      try {
        if (id) { await api.updatePost(id, { ...data, updatedAt: new Date().toISOString() }); showToast('Artikel diupdate'); }
        else { await api.createPost({ ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }); showToast('Artikel ditambahkan'); }
        document.getElementById('postModal').classList.add('hidden'); loadData();
      } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Simpan'; }
    }

    function handlePreview() {
      const data = {
        judul: document.getElementById('postJudul').value, penulis: document.getElementById('postPenulis').value,
        kategori: document.getElementById('postKategori').value, tanggal: document.getElementById('postTanggal').value,
        status: document.getElementById('postStatus').value, gambar: document.getElementById('postGambar').value,
        ringkasan: document.getElementById('postRingkasan').value, isi: quill.root.innerHTML,
      };
      document.getElementById('previewContent').innerHTML = `
        <span class="inline-block px-3 py-1 bg-green-50 text-green-700 text-xs font-semibold rounded-full mb-4 border-l-4 border-red-500">${escapeHtml(data.kategori)}</span>
        <h1 class="font-heading text-3xl font-extrabold mb-3">${escapeHtml(data.judul)}</h1>
        <div class="flex items-center gap-3 text-sm text-warm-400 mb-6"><span>${formatDate(data.tanggal)}</span><span>•</span><span>${escapeHtml(data.penulis)}</span></div>
        ${data.gambar ? `<img src="${escapeHtml(data.gambar)}" class="w-full h-64 object-cover rounded-xl mb-6" />` : ''}
        <p class="text-warm-500 italic mb-6">${escapeHtml(data.ringkasan)}</p>
        <div class="prose max-w-none font-light">${data.isi}</div>
      `;
      document.getElementById('previewModal').classList.remove('hidden');
    }

    // ============ FORM IKLAN ============
    function openAddAdModal() {
      document.getElementById('adForm').reset(); document.getElementById('adId').value = '';
      document.getElementById('adModalTitle').textContent = 'Tambah Iklan';
      document.getElementById('adFormError').classList.add('hidden');
      document.getElementById('adModal').classList.remove('hidden');
    }

    function openEditAdModal(id) {
      const a = allAds.find(x => x.id === id); if (!a) return;
      document.getElementById('adForm').reset();
      document.getElementById('adId').value = a.id;
      document.getElementById('adJudul').value = a.judul;
      document.getElementById('adGambar').value = a.gambar;
      document.getElementById('adLink').value = a.link;
      document.getElementById('adPosisi').value = a.posisi;
      document.getElementById('adStatus').value = a.status;
      document.getElementById('adModalTitle').textContent = 'Edit Iklan';
      document.getElementById('adFormError').classList.add('hidden');
      document.getElementById('adModal').classList.remove('hidden');
    }

    async function handleAdSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('adId').value;
      const data = {
        judul: document.getElementById('adJudul').value.trim(), gambar: document.getElementById('adGambar').value.trim(),
        link: document.getElementById('adLink').value.trim(), posisi: document.getElementById('adPosisi').value,
        status: document.getElementById('adStatus').value,
      };
      const btn = document.getElementById('adSaveBtn'), err = document.getElementById('adFormError');
      btn.disabled = true; btn.textContent = 'Menyimpan...'; err.classList.add('hidden');
      try {
        if (id) { await api.updateAd(id, data); showToast('Iklan diupdate'); }
        else { await api.createAd({ ...data, createdAt: new Date().toISOString() }); showToast('Iklan ditambahkan'); }
        document.getElementById('adModal').classList.add('hidden'); loadData();
      } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Simpan Iklan'; }
    }

    // ============ DELETE ============
    async function confirmDelete(type, id) {
      const isPost = type === 'post';
      const item = isPost ? allPosts.find(p => p.id === id) : allAds.find(a => a.id === id);
      if (!item) return;
      if (!confirm(`Hapus ${isPost ? 'artikel' : 'iklan'} "${item.judul}"?`)) return;
      try {
        if (isPost) await api.deletePost(id); else await api.deleteAd(id);
        showToast(`${isPost ? 'Artikel' : 'Iklan'} dihapus`); loadData();
      } catch (e) { showToast('Gagal hapus: ' + e.message, 'error'); }
    }

    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('Logout?')) { api.clearToken(); renderLogin(); }
      });
      const token = api.getToken(), user = api.getUser();
      if (token && user) renderDashboard(); else renderLogin();
    });
  </script>
</body>
</html>
